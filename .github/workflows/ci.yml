name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web-tests:
    name: Web unit tests (Vitest / TDD)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - run: npm test

  agent-import:
    name: Agent import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Smoke check: modules import (no DB/LLM calls at import time).
      - run: python -c "import main, agent, tools, db; print('agent imports OK')"
