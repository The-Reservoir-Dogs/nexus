name: Deploy to Databricks Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required repo secrets:
#   DATABRICKS_HOST   e.g. https://dbc-60b5b94b-8e3e.cloud.databricks.com
#   DATABRICKS_TOKEN  service-principal token (or PAT)
# Optional repo variables:
#   WORKSPACE_BASE     e.g. /Workspace/Users/<sp-or-user>/nexus  (default below)
# Narration audio is persisted to the Unity Catalog Volume set in web/app.yaml below
# (NARRATION_VOLUME). The app SP needs WRITE/READ VOLUME on it; edit the value there if
# your catalog/schema differ. Unset -> app writes to its (ephemeral) local disk.

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  WORKSPACE_BASE: ${{ vars.WORKSPACE_BASE || '/Workspace/Shared/nexus' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sudo sh

      - name: Build web (Next.js)
        working-directory: web
        # NEXT_PUBLIC_* are baked at BUILD time. Without this the build defaults to
        # NEXT_PUBLIC_API_MODE=mock and the deployed app serves canned/mock data
        # (e.g. chat returns a static reply) instead of hitting the live DB/agent.
        env:
          NEXT_PUBLIC_API_MODE: live
          NEXT_PUBLIC_BASE_URL: ""
        run: |
          npm ci || npm install
          npm run build

      # app.yaml is generated at deploy time (kept out of source; local uses start.sh).
      - name: Write app.yaml files
        run: |
          cat > web/app.yaml <<'EOF'
          command: ["npm", "run", "start"]
          env:
            - name: "DATABRICKS_SERVING_ENDPOINT"
              value: "databricks-claude-sonnet-5"
            - name: "AGENT_URL"
              value: "${{ vars.AGENT_URL }}"
            - name: "NARRATION_VOLUME"
              value: "/Volumes/nexus/media/narration"
          EOF
          # No secrets in app.yaml. The Gemini key is read at runtime from the
          # Databricks secret scope (nexus/gemini_api_key) by the app's service principal.
          cat > agent/app.yaml <<EOF
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "\$DATABRICKS_APP_PORT"]
          env:
            - name: "LLM_ENDPOINT"
              value: "${{ vars.LLM_ENDPOINT || 'gemini-2.5-flash' }}"
            - name: "SECRET_SCOPE"
              value: "nexus"
          EOF

      # Fail fast (in ~60s) with a clear message if the Databricks control plane is
      # unreachable, instead of hanging ~20 min on a TCP i/o timeout (see run #30184662159).
      - name: Verify Databricks connectivity
        run: |
          if ! timeout 60 databricks current-user me >/dev/null 2>&1; then
            echo "::error::Cannot reach ${DATABRICKS_HOST} within 60s (dial/i-o timeout). Verify DATABRICKS_HOST / DATABRICKS_TOKEN and that the workspace has no IP access list blocking GitHub-hosted runners."
            exit 1
          fi
          echo "Databricks control plane reachable."

      - name: Ensure apps exist
        run: |
          # bounded + retried so a transient network blip fails fast and self-heals
          retry() { for i in 1 2 3; do timeout 300 "$@" && return 0; echo "attempt $i failed, retrying in 15s…"; sleep 15; done; return 1; }
          databricks apps get nexus-web   >/dev/null 2>&1 || retry databricks apps create nexus-web
          databricks apps get nexus-agent >/dev/null 2>&1 || retry databricks apps create nexus-agent

      # `apps deploy` needs the app's COMPUTE up. Gate on compute_status=ACTIVE, not
      # app_status=RUNNING: a never-deployed app (e.g. nexus-agent) stays app_status
      # UNAVAILABLE until its first deploy, so waiting on RUNNING would hang forever.
      - name: Start apps (wait for compute ACTIVE)
        run: |
          start_wait() {
            local app=$1
            timeout 120 databricks apps start "$app" >/dev/null 2>&1 || true
            for i in $(seq 1 40); do
              json=$(timeout 60 databricks apps get "$app" --output json 2>/dev/null || echo '{}')
              cs=$(printf '%s' "$json" | python3 -c 'import sys,json;d=json.load(sys.stdin);print((d.get("compute_status") or {}).get("state") or "")' 2>/dev/null || echo "")
              as=$(printf '%s' "$json" | python3 -c 'import sys,json;d=json.load(sys.stdin);print((d.get("app_status") or {}).get("state") or "")' 2>/dev/null || echo "")
              echo "$app: compute=$cs app=$as"
              case "$cs" in ACTIVE|RUNNING) return 0;; esac   # compute up -> deployable
              case "$as" in RUNNING) return 0;; esac          # already-deployed app
              sleep 15
            done
            echo "::error::$app compute did not reach ACTIVE within ~10m (check app resource bindings / secret scope)"; return 1
          }
          start_wait nexus-web
          start_wait nexus-agent

      - name: Sync + deploy web
        run: |
          retry() { for i in 1 2 3; do timeout 600 "$@" && return 0; echo "attempt $i failed, retrying in 15s…"; sleep 15; done; return 1; }
          retry databricks sync web "${WORKSPACE_BASE}/web" --full
          retry databricks apps deploy nexus-web --source-code-path "${WORKSPACE_BASE}/web"

      - name: Sync + deploy agent
        run: |
          # The app ships only agent/, but narrate.py reuses the tts pipeline. Bundle the
          # stdlib-only tts modules flat into agent/ so `import render` resolves in prod
          # and /narrate works (no new pip deps; no filename collisions with agent/).
          cp tts/render.py tts/gemini_tts.py tts/voices.py agent/
          retry() { for i in 1 2 3; do timeout 600 "$@" && return 0; echo "attempt $i failed, retrying in 15s…"; sleep 15; done; return 1; }
          retry databricks sync agent "${WORKSPACE_BASE}/agent" --full
          retry databricks apps deploy nexus-agent --source-code-path "${WORKSPACE_BASE}/agent"

      # NOTE: bind resources once (UI or bundle): Lakebase DB -> both apps,
      # Model serving endpoint -> agent (and web if it proxies LLM).
